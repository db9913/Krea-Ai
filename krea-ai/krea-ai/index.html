<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krea AI – Free AI Chat Assistant</title>
<meta name="description" content="Krea AI is a fast, friendly AI chat assistant. Ask questions, write, brainstorm and get coding help.">
<meta property="og:title" content="Krea AI">
<meta property="og:description" content="A fast, friendly AI chat assistant.">
<meta name="theme-color" content="#050c33">
<style>
:root{--bg:#faf9f5;--surface:#fff;--text:#1f1e1d;--muted:#73726c;--line:#e5e2d9;--accent:#050c33;--accent-text:#fff;--user:#efece3;--code:#f1eee5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#262624;--surface:#30302e;--text:#f0eee6;--muted:#a09e94;--line:#454541;--user:#3a3a37;--code:#1f1e1d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#262624;--surface:#30302e;--text:#f0eee6;--muted:#a09e94;--line:#454541;--user:#3a3a37;--code:#1f1e1d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
body{flex-direction:row}
#side{width:272px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:10px;z-index:20}
.brand{font:600 20px/1 Georgia,"Times New Roman",serif;display:flex;align-items:center;gap:8px;padding:4px 8px 6px}
.brand span{color:var(--accent)}
#newc{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:10px 12px;font-weight:600;text-align:left}
#find{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;outline:0}
#find:focus{border-color:var(--accent)}
.lbl{font-size:12px;color:var(--muted);padding:4px 8px 0;text-transform:uppercase;letter-spacing:.04em}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:4px;border-radius:8px;padding:0 4px 0 10px}
.item:hover,.item.on{background:var(--user)}
.item button.t{flex:1;min-width:0;background:none;border:0;color:var(--text);text-align:left;padding:8px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item button.x{background:none;border:0;color:var(--muted);font-size:16px;padding:4px 6px;border-radius:6px;opacity:0}
.item:hover button.x,.item.on button.x{opacity:1}
.item button.x:hover{color:#b3261e}
.none{color:var(--muted);font-size:14px;padding:8px 10px}
#col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#top .brand{padding:0}
#menu{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;width:36px;height:36px;font-size:18px}
#scrim{display:none}
@media (max-width:760px){
 #side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
 body.open #side{transform:none}
 body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}
 #top{display:flex}
}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px}
.ghost:hover{background:var(--user)}
main{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto}
.empty{text-align:center;margin-top:12vh}
.empty h2{font:400 34px/1.2 Georgia,"Times New Roman",serif;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px}
.chip:hover{border-color:var(--accent)}
.msg{margin:0 0 22px}
.msg.user .bubble{background:var(--user);border-radius:16px;padding:10px 16px;margin-left:auto;width:fit-content;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .bubble{overflow-wrap:anywhere}
.bubble p{margin:0 0 12px}.bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:0 0 12px;padding-left:22px}
.bubble code{background:var(--code);padding:2px 5px;border-radius:5px;font:14px ui-monospace,Menlo,Consolas,monospace}
.bubble pre{background:var(--code);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.bubble pre code{background:none;padding:0}
.err{color:#b3261e}
.dots{color:var(--muted)}
footer{padding:8px 16px 16px}
.box{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 2px 10px rgba(0,0,0,.05)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--text);font:inherit;max-height:180px;padding:6px 0}
#send{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;width:38px;height:38px;font-size:18px;flex:none}
#send:disabled{opacity:.4;cursor:default}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span>✻</span> Krea AI</div>
  <button id="newc">+ New chat</button>
  <input id="find" placeholder="Search chats…" aria-label="Search chats">
  <div class="lbl">Recent</div>
  <div id="list"></div>
</aside>
<div id="scrim"></div>
<div id="col">
  <div id="top"><button id="menu" aria-label="Menu">☰</button><div class="brand"><span>✻</span> Krea AI</div></div>
  <main id="main"><div class="wrap" id="log"></div></main>
  <footer>
    <div class="box">
      <textarea id="in" rows="1" placeholder="Ask me anything…" aria-label="Message"></textarea>
      <button id="send" aria-label="Send">↑</button>
    </div>
    <div class="note">AI can make mistakes. Check important info.</div>
  </footer>
</div>
<script>
const SYSTEM = "You are a friendly, helpful AI assistant. Answer clearly and concisely. Use Markdown (short lists, **bold**, fenced code blocks) when it helps.";
function nowInfo(){
  const d = new Date(), tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  return "The user’s current local date and time is " + d.toLocaleString("en-US", { dateStyle: "full", timeStyle: "long" }) + " (" + tz + ").";
}
const SUGGEST = ["Explain something simply","Help me write an email","Brainstorm project ideas","Debug my code"];
const log = document.getElementById("log"), main = document.getElementById("main"),
      input = document.getElementById("in"), sendBtn = document.getElementById("send");
let chats = [], cur = null, history = [], busy = false, ctrl = null, samplePromise = null, filter = "";
const list = document.getElementById("list");
const uid = () => Math.random().toString(36).slice(2, 10);
try {
  chats = JSON.parse(localStorage.getItem("chats") || "[]");
  if (!chats.length) { const old = JSON.parse(localStorage.getItem("chat") || "[]"); if (old.length) chats = [{ id: uid(), title: old[0].content.slice(0, 40), messages: old }]; }
} catch (e) { chats = []; }
if (chats.length) { cur = chats[0].id; history = chats[0].messages; }
function save(){
  if (cur) { const c = chats.find(x => x.id === cur); if (c) { c.messages = history; if (!c.title && history[0]) c.title = history[0].content.slice(0, 40); } }
  try { localStorage.setItem("chats", JSON.stringify(chats)); } catch (e) {}
  renderList();
}
function renderList(){
  list.innerHTML = "";
  const q = filter.toLowerCase();
  const shown = chats.filter(c => c.title && (!q || c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q))));
  if (!shown.length) { const n = document.createElement("div"); n.className = "none"; n.textContent = q ? "No matching chats." : "No chats yet."; list.appendChild(n); return; }
  shown.forEach(c => {
    const row = document.createElement("div"); row.className = "item" + (c.id === cur ? " on" : "");
    const t = document.createElement("button"); t.className = "t"; t.textContent = c.title; t.onclick = () => openChat(c.id);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "Delete chat"); x.onclick = () => delChat(c.id);
    row.append(t, x); list.appendChild(row);
  });
}
function openChat(id){
  if (busy && ctrl) ctrl.abort();
  const c = chats.find(x => x.id === id); if (!c) return;
  cur = id; history = c.messages; document.body.classList.remove("open"); render(); renderList();
}
function delChat(id){
  if (busy && ctrl && id === cur) ctrl.abort();
  chats = chats.filter(c => c.id !== id);
  try { localStorage.setItem("chats", JSON.stringify(chats)); } catch (e) {}
  if (id === cur) { cur = chats[0] ? chats[0].id : null; history = chats[0] ? chats[0].messages : []; render(); }
  renderList();
}
function newChat(){
  if (busy && ctrl) ctrl.abort();
  cur = null; history = []; document.body.classList.remove("open"); render(); renderList(); input.focus();
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(src){
  const blocks = [];
  let t = esc(src).replace(/```(?:\w+)?\n?([\s\S]*?)(```|$)/g, (_, c) => { blocks.push(c.replace(/\n$/,"")); return "\u0000" + (blocks.length-1) + "\u0000"; });
  t = t.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  const out = [];
  t.split(/\n{2,}/).forEach(p => {
    const lines = p.split("\n");
    if (lines.every(l => /^\s*[-*] /.test(l))) out.push("<ul>" + lines.map(l => "<li>" + l.replace(/^\s*[-*] /,"") + "</li>").join("") + "</ul>");
    else if (lines.every(l => /^\s*\d+[.)] /.test(l))) out.push("<ol>" + lines.map(l => "<li>" + l.replace(/^\s*\d+[.)] /,"") + "</li>").join("") + "</ol>");
    else out.push("<p>" + lines.join("<br>") + "</p>");
  });
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => "<pre><code>" + blocks[i] + "</code></pre>").replace(/<p>(<pre>[\s\S]*?<\/pre>)<\/p>/g,"$1");
}

function addMsg(role, text){
  const m = document.createElement("div"); m.className = "msg " + role;
  const b = document.createElement("div"); b.className = "bubble";
  if (role === "user") b.textContent = text; else b.innerHTML = md(text);
  m.appendChild(b); log.appendChild(m); main.scrollTop = main.scrollHeight; return b;
}

function render(){
  log.innerHTML = "";
  if (!history.length){
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = "<h2>How can I help today?</h2><p>Ask a question, or try one of these.</p>";
    const c = document.createElement("div"); c.className = "chips";
    SUGGEST.forEach(s => { const b = document.createElement("button"); b.className = "chip"; b.textContent = s; b.onclick = () => ask(s); c.appendChild(b); });
    e.appendChild(c); log.appendChild(e); return;
  }
  history.forEach(h => addMsg(h.role === "user" ? "user" : "ai", h.content));
}

function setBusy(v){
  busy = v; sendBtn.textContent = v ? "■" : "↑"; sendBtn.setAttribute("aria-label", v ? "Stop" : "Send");
  sendBtn.disabled = false;
}

async function ask(text){
  text = (text || "").trim();
  if (!text || busy) return;
  input.value = ""; input.style.height = "auto";
  if (!cur) { const c = { id: uid(), title: text.slice(0, 40), messages: [] }; chats.unshift(c); cur = c.id; history = c.messages; }
  history.push({ role: "user", content: text });
  if (history.length === 1) render(); else addMsg("user", text);
  const bubble = addMsg("ai", ""); bubble.innerHTML = '<span class="dots">Thinking…</span>';
  setBusy(true); ctrl = new AbortController();
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal, body: JSON.stringify({ messages: history, now: nowInfo() }) });
    const data = await r.json().catch(() => ({}));
    if (r.status === 429) throw { code: "rate_limited", message: data.error || "Too many requests. Please wait and try again." };
    if (!r.ok) throw { message: data.error || "Something went wrong." };
    history.push({ role: "assistant", content: data.text }); bubble.innerHTML = md(data.text);
  } catch (e) {
    const partial = e && e.text;
    if (partial) { history.push({ role: "assistant", content: partial }); }
    else {
      history.pop();
      const msg = e && e.code === "not_granted" ? "Permission was declined. Send your message again to retry."
        : e && e.code === "rate_limited" ? "Too many requests. Please wait a moment and try again."
        : (ctrl && ctrl.signal.aborted) ? "Stopped." : (e && e.message) || "Something went wrong.";
      bubble.innerHTML = '<span class="err">' + esc(msg) + "</span>";
    }
  }
  save(); setBusy(false); ctrl = null;
}

sendBtn.onclick = () => busy ? ctrl && ctrl.abort() : ask(input.value);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(input.value); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; });
document.getElementById("newc").onclick = newChat;
document.getElementById("menu").onclick = () => document.body.classList.add("open");
document.getElementById("scrim").onclick = () => document.body.classList.remove("open");
document.getElementById("find").addEventListener("input", e => { filter = e.target.value; renderList(); });
render(); renderList();
</script>
</body>
</html>
